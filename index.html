<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversor de temperatura</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

</head>
<body>
    <div class="principal">
        <form action="" class="form">
        <fieldset>
            <legend class="legend">Conversor de Temperatura</legend>

            <p>Adicione a temperatura que se deseja converter em seu campo e clique no botão para que a mesma apareça convertida em ambas as outras escalas termométricas. </p>
            <div class="div">
                <label for="celcius" class="label">Celcius</label>
                <input type="number" name="celcius" id="celcius" class="input" >

            <div class="div">
                <label for="farenheit" class="label">Farenheit</label>
                <input type="number" name="farenheit" id="farenheit" class="input" >
            </div>

            <div class="div">
                <label for="kelvin" class="label">Kelvin</label>
                <input type="number" name="kelvin" id="kelvin" class="input">
            </div>


              <button type="button" class="botao" onclick="ConverterTemperatura()">Converter</button>

        </fieldset>
        </form>
    </div>
</body>
</html>
